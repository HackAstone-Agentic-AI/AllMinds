databases:
  - name: allminds-postgres
    databaseName: allminds_db
    user: allminds
    plan: basic-256mb
    region: frankfurt

services:
  - type: web
    runtime: node
    name: allminds-backend
    rootDir: apps/backend
    plan: pro
    region: frankfurt
    buildCommand: npm install
    preDeployCommand: npm run db:init && npm run db:migrate
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: allminds-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: BCRYPT_ROUNDS
        value: 10
      - key: BACKEND_URL
        value: https://allminds-backend.onrender.com
      - key: FRONTEND_URL
        value: https://all-minds-ai.com
      - key: AGENTIC_AI_URL
        value: https://allminds-agents.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://all-minds-ai.com,https://www.all-minds-ai.com,https://allminds-frontend.onrender.com
      - key: APP_TIMEZONE
        value: Africa/Johannesburg
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MICROSOFT_CLIENT_SECRET
        sync: false
      - key: APPLE_CLIENT_ID
        sync: false
      - key: APPLE_CLIENT_SECRET
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: 587
      - key: EMAIL_SECURE
        value: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false

  - type: web
    runtime: python
    name: allminds-agents
    rootDir: apps/agents
    plan: pro
    region: frankfurt
    # Build the DCAPS vector index during the build so the first question is fast.
    buildCommand: pip install -r requirements.txt && python -m app.agents.rag_agent build
    startCommand: uvicorn app.api.index:app --host 0.0.0.0 --port $PORT --workers 2
    healthCheckPath: /health
    # Persistent disk so Thandi's conversation memory survives deploys.
    disk:
      name: agents-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: allminds-postgres
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: https://all-minds-ai.com,https://www.all-minds-ai.com,https://allminds-frontend.onrender.com
      - key: BACKEND_API_URL
        value: https://allminds-backend.onrender.com/api
      - key: APP_TIMEZONE
        value: Africa/Johannesburg
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: MEMORY_DB_PATH
        value: /var/data/thandi_memory.sqlite

  - type: web
    runtime: node
    name: allminds-frontend
    rootDir: apps/frontend
    plan: pro
    region: frankfurt
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://allminds-backend.onrender.com/api
      - key: BACKEND_API_URL
        value: https://allminds-backend.onrender.com/api
      - key: AGENTIC_AI_URL
        value: https://allminds-agents.onrender.com
      - key: NEXT_PUBLIC_APP_URL
        value: https://all-minds-ai.com
